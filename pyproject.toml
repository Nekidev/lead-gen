[project]
name = "lead-gen"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Rafael Bradley", email = "rafabradleyrb@gmail.com" }]
dependencies = [
  "apkpure>=0.3.0",
  "fastapi[standard]>=0.141.1",
  "google-play-scraper>=1.2.7",
  "httpx>=0.28.1",
  "jinja2>=3.1.6",
  "python-dotenv>=1.2.3",
  "python-multipart>=0.0.32",
  "rich>=15.0.0",
  "serpapi>=1.1.1",
  "tortoise-orm[accel]>=1.1.8",
  "uvicorn>=0.54.0",
]

[project.scripts]
lead-gen = "lead_gen:run"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.tortoise]
tortoise_orm = "lead_gen.database.CONFIG"
